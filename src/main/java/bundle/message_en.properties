sangpum-hoogi=Customer Reviews
hoogi-1=The product quality here is flawless. From furniture to beds, everything is finished with care and shipping was fast, so I bought all the furniture I needed after moving from this store. The mattress in particular gets more satisfying the longer I use it.
hoogi-2=I bought a desk and chair for working from home. Assembly was easy and my back feels so comfortable when sitting. Even after sitting all day I feel less fatigue, and the clean design really brightened up my room. I've been actively recommending it to everyone around me.
hoogi-3=I ordered a comforter and pillows as a gift, and they felt so soft that I bought a set for myself too. They keep their shape even after washing, and the seasonal fabric helps me sleep soundly at night. The best quality for the price.